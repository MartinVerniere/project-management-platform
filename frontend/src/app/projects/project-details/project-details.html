@if (project.isLoading()) {
<div class="loading">Loading...</div>
} @else if (project.error()) {
<div class="error">Error loading project info</div>
} @else {
@if (project.value(); as project) {
<div class="project-header">
	<div>
		<div class="project-key">{{ project.key }}</div>
		<h1 class="project-name">{{ project.name }}</h1>

		@if (project.description) {
		<p class="project-description">
			{{ project.description }}
		</p>
		}
	</div>

	<a class="back-button" routerLink="/projects">
		← Projects
	</a>
</div>

<div class="project-content">
	<app-board-list [projectId]="project.id" [hasAdminPermissions]="hasAdminPermissions()">
	</app-board-list>

	<app-member-list [projectId]="project.id" [memberList]="project.members" [hasAdminPermissions]="hasAdminPermissions()"
		(memberAdded)="onMemberAdded()" (memberRemoved)="onMemberRemoved()">
	</app-member-list>
</div>
}
}
