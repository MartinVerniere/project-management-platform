<div class="column-form-card">
	<div class="column-form-intro">
		<div class="column-icon">
			<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
				<rect x="7" y="7" width="2.5" height="10" rx="1" fill="currentColor" />
				<rect x="10.75" y="5" width="2.5" height="14" rx="1" fill="currentColor" />
				<rect x="14.5" y="7" width="2.5" height="10" rx="1" fill="currentColor" />
			</svg>
		</div>

		<div class="intro-content">
			<div class="header"> New column </div>
			<h1 class="title"> Create column </h1>
			<div class="subtext">
				Add a column to organize your tasks.
			</div>
		</div>
	</div>

	<form class="column-form" (submit)="onSubmit($event)">
		<div class="form-grid">
			<div class="form-group">
				<label class="form-label" for="name">
					<div>Name</div>
					<div class="required">*</div>
				</label>

				<input id="name" type="text" placeholder="e.g. Backlog" [formField]="columnForm.name" />

				@if (columnForm.name().invalid() && columnForm.name().touched()) {
				<div class="field-error">
					@for (error of columnForm.name().errors(); track error.kind) {
					<div>
						{{ error.message }}
					</div>
					}
				</div>
				}
			</div>

			@if (error()) {
			<div class="server-error">
				<div class="server-error-icon">
					!
				</div>

				<div>
					{{ error() }}
				</div>
			</div>
			}

			<div class="form-actions">
				<button class="danger" type="button" [routerLink]="['/projects', projectId, 'boards', boardId]">
					Cancel
				</button>

				<button class="primary" type="submit" [disabled]="columnForm().invalid()">
					<div>Create column</div>
					<div class="btn-arrow">→</div>
				</button>
			</div>
		</div>
	</form>
</div>
