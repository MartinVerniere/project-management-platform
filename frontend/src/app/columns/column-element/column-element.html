@if (column(); as column) {
<div class="column-header">
	<div class="column-title">
		<div class="column-handle" cdkDragHandle aria-label="Drag column" title="Drag column">
			<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
				<circle cx="5" cy="3" r="1.25" />
				<circle cx="11" cy="3" r="1.25" />
				<circle cx="5" cy="8" r="1.25" />
				<circle cx="11" cy="8" r="1.25" />
				<circle cx="5" cy="13" r="1.25" />
				<circle cx="11" cy="13" r="1.25" />
			</svg>
		</div>

		<div class="column-info">
			<div class="column-name-row">
				<h2 class="header">
					{{ column.name }}
				</h2>

				<span class="task-count">
					{{ column.tasks.length }}
				</span>
			</div>
		</div>
	</div>

	<div class="column-actions">
		<button class="primary" type="button" [routerLink]="['/projects', projectId(), 'boards', boardId(), 'columns', column.id, 'tasks', 'create']">
			+ Task
		</button>

		@if (hasAdminPermissions()) {
		<button type="button" class="secondary" [routerLink]="['/projects', projectId(), 'boards', boardId(), 'columns', column.id, 'edit']">
			Edit
		</button>

		<button type="button" class="danger" (click)="onRemoveColumn(column.id)">
			Delete
		</button>
		}
	</div>
</div>

<app-task-list [taskList]="column.tasks" [projectId]="projectId()" [boardId]="boardId()" [columnId]="column.id"
	[memberList]="memberList()" [filtersActive]="filtersActive()" [hasAdminPermissions]="hasAdminPermissions()"
	(taskListEdited)="columnElementEdited.emit()" (moveTaskToColumn)="moveTaskToColumn.emit({taskId: $event, destinationColumnId: column.id})">
</app-task-list>

@if (error()) {
<div class="error">
	{{ error() }}
</div>
}
}
