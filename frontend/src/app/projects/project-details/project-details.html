@if (project.isLoading()) {
<div class="loading">
	Loading...
</div>
} @else if (project.error()) {
<div class="error">
	Error loading project info
</div>
} @else {
@if (project.value(); as project) {
<div class="project-page">
	<header class="project-header">
		<div class="project-header-top">
			<a class="back-button" routerLink="/projects">
				<span aria-hidden="true">←</span>
				<span>Projects</span>
			</a>

			<span class="project-key">
				{{ project.key }}
			</span>
		</div>

		<h1 class="project-name">
			{{ project.name }}
		</h1>

		@if (project.description) {
		<p class="project-description">
			{{ project.description }}
		</p>
		}
	</header>

	<main class="project-content">
		<section class="boards-section">
			<app-board-list [projectId]="project.id" [hasAdminPermissions]="hasAdminPermissions()">
			</app-board-list>
		</section>

		<section class="members-section">
			<app-member-list [projectId]="project.id" [memberList]="project.members"
				[hasAdminPermissions]="hasAdminPermissions()" (memberAdded)="onMemberAdded()"
				(memberRemoved)="onMemberRemoved()">
			</app-member-list>
		</section>
	</main>
</div>
}
}
