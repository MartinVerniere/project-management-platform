@if (board(); as board) {
<div class="board-content">
	<div class="board-identity">
		<div class="board-icon" aria-hidden="true">▦</div>

		<div class="board-details">
			<h3 class="board-name">
				{{ board.name }}
			</h3>

			<span class="board-label">
				Project board
			</span>
		</div>
	</div>

	<div class="board-actions">
		<button type="button" class="primary" [routerLink]="['/projects', projectId(), 'boards', board.id]">
			View
		</button>

		@if (hasAdminPermissions()) {
		<button type="button" class="secondary" [routerLink]="['/projects', projectId(), 'boards', board.id, 'edit']">
			Edit
		</button>

		<button type="button" class="danger" (click)="onDeleteBoard(board.id)">
			Delete
		</button>
		}
	</div>
</div>

@if (error()) {
<div class="error">
	{{ error() }}
</div>
}
}
