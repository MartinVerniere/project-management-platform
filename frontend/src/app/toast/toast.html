<div class="toast-container">
	@for (toast of toastService.toasts(); track toast.id) {
	<div class="toast" [class.success]="toast.type === 'success'" [class.error]="toast.type === 'error'"
		[class.info]="toast.type === 'info'">
		<div class="toast-icon">
			@if (toast.type === 'success') {
			<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
				<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" />
				<path d="M8 12.5L10.5 15L16 9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
					stroke-linejoin="round" />
			</svg>
			} @else if (toast.type === 'error') {
			<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
				<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" />
				<path d="M12 8V12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
				<circle cx="12" cy="16" r="1" fill="currentColor" />
			</svg>
			} @else {
			<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
				<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" />
				<path d="M12 10V16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
				<circle cx="12" cy="7.5" r="1" fill="currentColor" />
			</svg>
			}
		</div>

		<div class="toast-message">
			{{ toast.message }}
		</div>

		<button class="toast-close" type="button" title="Close" (click)="toastService.remove(toast.id)">
			<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
				<path d="M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
				<path d="M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
			</svg>
		</button>
	</div>
	}
</div>
