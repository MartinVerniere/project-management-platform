@if (project(); as project) {
<div class="project-main">
	<div class="project-key">
		{{ project.key }}
	</div>

	<h3 class="project-name">
		{{ project.name }}
	</h3>

	@if (project.description) {
	<div class="project-description">
		{{ project.description }}
	</div>
	}
</div>

<div class="project-actions">
	<button class="primary open-button" type="button" [routerLink]="['/projects', project.id]">
		Open project →
	</button>

	@if (hasDeletePermission()) {
	<button class="danger delete-button" type="button" (click)="onDeleteProject(project.id)">
		Delete
	</button>
	}
</div>

@if (error()) {
<div class="error">
	{{ error() }}
</div>
}
}
