<div class="navigation-section">
	<a class="nav-link" routerLink="/">Home</a>
	<a class="nav-link" routerLink="/projects">Projects</a>
</div>

<div class="user-section">
	@if (authService.isLoggedIn()) {
	<div class="user-info">
		<div class="username">
			{{ authService.user()?.username }}
		</div>

		<div class="avatar">
			<img class="avatar-image" [src]="authService.user()?.avatarUrl ?? avatarPreview()" />
		</div>
	</div>

	<button class="logout-button" type="button" (click)="onLogout()">
		Logout
	</button>
	} @else {
	<button class="primary" type="button" routerLink="/login">Login</button>
	<button class="secondary" type="button" routerLink="/register">Register</button>
	}
</div>
