<div class="task-update-form-card">
	<div class="task-update-form-header">
		<div class="task-icon">
			<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
				<rect x="4" y="5" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.8" />
				<path d="M8 9H16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
				<path d="M8 13H13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
			</svg>
		</div>

		<div>
			<div class="header"> Edit task </div>
			<h1 class="title"> Update task </h1>
			<div class="subtext">
				Update the details of this task.
			</div>
		</div>
	</div>

	<form class="task-update-form" (submit)="onSubmit($event)">
		<div class="form-grid">
			<div class="form-group">
				<label class="form-label" for="title">
					<div>Title</div>
					<div class="required">*</div>
				</label>

				<input id="title" type="text" placeholder="e.g. Implement authentication"
					[formField]="taskForm.title" />

				@if (taskForm.title().invalid() && taskForm.title().touched()) {
				<div class="field-error">
					@for (error of taskForm.title().errors(); track error.kind) {
					{{ error.message }}
					}
				</div>
				}
			</div>

			<div class="form-group">
				<label class="form-label" for="description">
					Description
					<div class="optional">Optional</div>
				</label>

				<textarea id="description" placeholder="Describe what needs to be done..."
					[formField]="taskForm.description">
                </textarea>

				<div class="field-hint">
					Update any details that help explain the task.
				</div>
			</div>

			@if (error()) {
			<div class="server-error">
				<div class="server-error-icon"> ! </div>
				{{ error() }}
			</div>
			}

			<div class="form-actions">
				<button class="secondary" type="button" (click)="onCancel()">
					Cancel
				</button>

				<button class="primary" type="submit" [disabled]="taskForm().invalid()">
					Save changes →
				</button>
			</div>
		</div>
	</form>
</div>
