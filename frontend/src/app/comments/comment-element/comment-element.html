@if (comment(); as comment) {
<div class="comment-header">
	<div class="comment-creator">{{ comment.user.username }}</div>
</div>
@if (editCommentFormEnabled()) {
<app-comment-update-form [comment]="comment" (commentEdited)="onCommentEdited()"
	(canceledCommentEdit)="onCancelEditComment()">
</app-comment-update-form>
} @else {
<div class="comment-content">
	{{ comment.content }}
</div>
<div class="comment-actions">
	@if(hasCommentEditorPermissions()){
	<button type="button" class="btn btn-secondary" (click)="onEnableEditComment()">
		Edit
	</button>

	<button type="button" class="btn btn-danger" (click)="onCommentDeleted(comment.id)">
		Delete
	</button>
	}
</div>
}

@if (error(); as error) {
<div class="error">{{ error }}</div>
}
}
