<div class="board-update-form-card">
	<div class="board-update-form-intro">
		<div class="board-icon">▦</div>

		<div class="intro-content">
			<div class="header"> Edit board </div>
			<h1 class="title"> Update board </h1>
			<div class="subtext">
				Change the name of this board.
			</div>
		</div>
	</div>

	<form class="board-update-form" (submit)="onSubmit($event)">
		<div class="form-grid">
			<div class="form-group">
				<label class="form-label" for="name">
					<div>Name</div>
					<div class="required">*</div>
				</label>

				<input id="name" type="text" placeholder="e.g. Sprint Board" [formField]="boardForm.name" />

				@if (boardForm.name().invalid() && boardForm.name().touched()) {
				<div class="field-error">
					@for (error of boardForm.name().errors(); track error.kind) {
					<div>{{ error.message }}</div>
					}
				</div>
				}
			</div>

			@if (error()) {
			<div class="server-error">
				<div class="server-error-icon">!</div>
				<div>{{ error() }}</div>
			</div>
			}

			<div class="form-actions">
				<button class="danger" type="button" (click)="onCancel()">
					Cancel
				</button>

				<button class="primary" type="submit" [disabled]="boardForm().invalid()">
					<div>Save changes</div>
					<div class="btn-arrow">→</div>
				</button>
			</div>
		</div>
	</form>
</div>
