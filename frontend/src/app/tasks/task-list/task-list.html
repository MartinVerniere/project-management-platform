@if (taskList(); as taskList){
<div cdkDropList [cdkDropListData]="taskList" (cdkDropListDropped)="onMoveTask($event)"
	[cdkDropListEnterPredicate]="enabledDragAndDropPredicate" [cdkDropListSortingDisabled]="filtersActive()">
	<div class="task-list">
		<h3 class="task-title"> Tasks </h3>
		<div class="task-element-list">
			@for (task of taskList; track task.id; let i = $index) {
			<div cdkDrag [cdkDragData]="{ type: 'task', task: task }">
				<app-task-element [task]="task" [projectId]="projectId()" [boardId]="boardId()" [columnId]="columnId()" [memberList]="memberList()"
					(taskDeleted)="taskListEdited.emit()" (taskCommentsEdited)="taskListEdited.emit()"
					(taskAssigneeEdited)="taskListEdited.emit()">
				</app-task-element>
			</div>
			} @empty {
			<div class="task-list-empty">No tasks yet!</div>
			}
		</div>
		<button
			[routerLink]="['/projects', projectId(), 'boards', boardId(), 'columns', columnId(), 'tasks', 'create']">
			Create new task
		</button>
	</div>
</div>
}
