<form class="task-form" (submit)="(onSubmit($event))">
	<div class="form-grid">
		<div class="form-group">
			<label class="form-label" for="title"> Title </label>
			<input id="title" class="form-input" type="text" placeholder="Project A" [formField]="taskForm.title" />

			@if(taskForm.title().invalid() && taskForm.title().touched()){
			<div class="error">
				@for (error of taskForm.title().errors(); track error.kind){
				<span> {{error.message}}</span>
				}
			</div>
			}
		</div>

		<div class="form-group">
			<label class="form-label" for="description"> Description </label>
			<input id="description" class="form-input" type="text" placeholder="Description"
				[formField]="taskForm.description" />
		</div>

		<div class="form-error">
			@if (error()) {
			<div class="error">
				<span>{{ error() }}</span>
			</div>
			}
		</div>

		<div class="form-actions">
			<button class="btn btn-primary" type="submit" [disabled]="taskForm().invalid()">
				Update task
			</button>
			<button (click)="onCancel()">Cancel</button>
		</div>
	</div>
</form>
