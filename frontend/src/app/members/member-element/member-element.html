@if (member(); as member) {
<div class="member-info">
	<div class="member-name">
		{{ member.user.username }}
	</div>

	<div class="member-role">
		{{ member.role }}
	</div>
</div>

@if(hasAdminPermissions()){
<button class="danger" type="button" (click)="onRemoveMember(member.user.id)">
	Remove
</button>
}

@if (error()) {
<div class="error">
	{{ error() }}
</div>
}
}
