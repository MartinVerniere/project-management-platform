<form class="comment-update-form" (submit)="onSubmit($event)">

	<div class="form-group">

		<label class="form-label" for="content">
			Comment
		</label>

		<textarea id="content" rows="3" [formField]="commentForm.content">
        </textarea>

	</div>

	@if (error(); as error) {

	<div class="form-error">
		{{ error }}
	</div>

	}

	<div class="form-actions">

		<button class="primary" type="submit" [disabled]="commentForm().invalid()">
			Save changes
		</button>

		<button class="secondary" type="button" (click)="onCancel()">
			Cancel
		</button>

	</div>

</form>
