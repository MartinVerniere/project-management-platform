<div class="comment-list">
	<h3 class="comment-title">Comments</h3>
	@for (comment of commentList(); track comment.id; let i = $index) {
	<app-comment-element [projectId]="projectId()" [boardId]="boardId()" [columnId]="columnId()"
		[taskId]="taskId()" [comment]="comment"></app-comment-element>
	} @empty {
	<div class="comment-list-empty">No comments yet!</div>
	}
	<button
		[routerLink]="['/projects', projectId(), 'boards', boardId(), 'columns', columnId(), 'task', taskId(), 'comments', 'create']">
		Create new comment
	</button>
</div>
